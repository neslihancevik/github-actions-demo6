name: JavaScript CI/CD Demo

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check math.js

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Uygulama dağıtıma hazır!"
